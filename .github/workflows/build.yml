name: Build Navigation Switcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="$ANDROID_HOME"

          echo "Android SDK: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK directory not found"
            exit 1
          fi

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)

          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager at: $SDKMANAGER"
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          else
            echo "sdkmanager not required - using preinstalled Android SDK"
          fi

      - name: Check Android 16 SDK
        run: |
          echo "Checking Android SDK..."

          test -d "$ANDROID_HOME/platforms/android-36"

          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "Build tools 36.0.0 not found"
            echo "Available build tools:"
            ls -la "$ANDROID_HOME/build-tools/" || true
            exit 1
          fi

          echo "Android 16 SDK found"
          echo "Build tools 36.0.0 found"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q ./*.zip -d extracted

          echo "Project extracted:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Find Android project
        run: |
          PROJECT_FILE=$(find extracted -name settings.gradle.kts -type f -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Could not find settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found Android project at:"
          echo "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavigationSwitcher-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
