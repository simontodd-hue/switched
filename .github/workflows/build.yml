name: Build Navigation Switcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="$ANDROID_HOME"

          echo "Android SDK: $SDK"

          test -d "$SDK"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Check Android 16 SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android 16 SDK found"
          echo "Build tools 36.0.0 found"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q ./*.zip -d extracted

          echo "ZIP extracted successfully"

      - name: Find Android project
        run: |
          PROJECT_FILE=$(find extracted \
            -name settings.gradle.kts \
            -type f \
            -print \
            -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Fix Java and Kotlin JVM targets
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          EOF

          echo "JVM targets fixed to Java 17"

      - name: Fix Navigation AIDL references
        working-directory: ${{ env.PROJECT_DIR }}
        run: |

          echo "========================================"
          echo "Finding INavigationService.aidl"
          echo "========================================"

          AIDL=$(find app/src/main/aidl \
            -type f \
            -name "INavigationService.aidl" \
            -print \
            -quit)

          if [ -z "$AIDL" ]; then
            echo "ERROR: INavigationService.aidl not found"
            find app/src/main/aidl -type f -print
            exit 1
          fi

          echo "AIDL:"
          echo "$AIDL"

          AIDL_PACKAGE=$(sed -n 's/^[[:space:]]*package[[:space:]]\+\(.*\);[[:space:]]*$/\1/p' "$AIDL" | head -1 | tr -d '\r')

          if [ -z "$AIDL_PACKAGE" ]; then
            echo "ERROR: Could not determine AIDL package"
            cat "$AIDL"
            exit 1
          fi

          echo "AIDL package:"
          echo "$AIDL_PACKAGE"

          FULL_NAME="${AIDL_PACKAGE}.INavigationService"

          echo "Full service name:"
          echo "$FULL_NAME"

          SERVICE="app/src/main/java/com/simon/navigation_switcher/NavigationUserService.java"
          CONTROLLER="app/src/main/java/com/simon/navigation_switcher/NavigationController.java"

          echo ""
          echo "========================================"
          echo "Repairing NavigationUserService.java"
          echo "========================================"

          if [ ! -f "$SERVICE" ]; then
            echo "ERROR: NavigationUserService.java not found"
            exit 1
          fi

          # Remove EVERY import containing INavigationService.
          sed -i '/^[[:space:]]*import[[:space:]].*INavigationService.*;/d' "$SERVICE"

          # Add the correct import immediately after the package line.
          sed -i "/^[[:space:]]*package[[:space:]]/a import ${FULL_NAME};" "$SERVICE"

          # Remove invalid Override annotations.
          sed -i '/^[[:space:]]*@Override[[:space:]]*$/d' "$SERVICE"

          echo ""
          echo "========================================"
          echo "Repairing NavigationController.java"
          echo "========================================"

          if [ ! -f "$CONTROLLER" ]; then
            echo "ERROR: NavigationController.java not found"
            exit 1
          fi

          # Remove EVERY import containing INavigationService.
          sed -i '/^[[:space:]]*import[[:space:]].*INavigationService.*;/d' "$CONTROLLER"

          # Add the correct import.
          sed -i "/^[[:space:]]*package[[:space:]]/a import ${FULL_NAME};" "$CONTROLLER"

          echo ""
          echo "========================================"
          echo "FINAL NavigationUserService.java"
          echo "========================================"

          cat "$SERVICE"

          echo ""
          echo "========================================"
          echo "FINAL NavigationController.java"
          echo "========================================"

          cat "$CONTROLLER"

          echo ""
          echo "========================================"
          echo "Checking for bad imports"
          echo "========================================"

          if grep -RniE 'import[[:space:]]+INavigationService' app/src/main/java; then
            echo "ERROR: Bad INavigationService import still exists"
            exit 1
          fi

          echo "No malformed INavigationService imports found"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavigationSwitcher-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
