name: Build Navigation Switcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="$ANDROID_HOME"

          echo "Android SDK: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK directory not found"
            exit 1
          fi

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)

          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager at: $SDKMANAGER"
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          fi

      - name: Check Android 16 SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"

          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "Build tools 36.0.0 not found"
            ls -la "$ANDROID_HOME/build-tools/"
            exit 1
          fi

          echo "Android 16 SDK found"
          echo "Build tools 36.0.0 found"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q ./*.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_FILE=$(find extracted -name settings.gradle.kts -type f -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Could not find settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found Android project:"
          echo "$PROJECT_DIR"

      - name: Fix Java and Kotlin JVM targets
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          EOF

          echo "Java and Kotlin JVM targets set to 17"

      - name: Fix Shizuku service source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SERVICE_DIR="app/src/main/java/com/simon/navigation_switcher"

          echo "Checking Java source files..."

          if [ -d "$SERVICE_DIR" ]; then
            echo "Found source directory:"
            echo "$SERVICE_DIR"
          else
            echo "Source directory not found:"
            echo "$SERVICE_DIR"
            exit 1
          fi

          AIDL=$(find app/src/main/aidl -name "INavigationService.aidl" -type f -print -quit)

          if [ -z "$AIDL" ]; then
            echo "Could not find INavigationService.aidl"
            exit 1
          fi

          echo "Found AIDL:"
          echo "$AIDL"

          AIDL_PACKAGE=$(grep '^package ' "$AIDL" | sed 's/package //;s/;//' | tr -d '\r')

          if [ -z "$AIDL_PACKAGE" ]; then
            echo "Could not determine AIDL package"
            exit 1
          fi

          echo "AIDL package: $AIDL_PACKAGE"

          echo "Fixing INavigationService imports..."

          find app/src/main/java -name "*.java" -type f -print0 | while IFS= read -r -d '' FILE
          do
            sed -i "s/^import INavigationService;$/import ${AIDL_PACKAGE}.INavigationService;/" "$FILE"
          done

          echo "Checking NavigationUserService.java..."
          sed -n '1,120p' app/src/main/java/com/simon/navigation_switcher/NavigationUserService.java

      - name: Fix incompatible Shizuku overrides
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          SERVICE="app/src/main/java/com/simon/navigation_switcher/NavigationUserService.java"

          if [ ! -f "$SERVICE" ]; then
            echo "NavigationUserService.java not found"
            exit 1
          fi

          sed -i 's/@Override[[:space:]]*//g' "$SERVICE"

          echo "Shizuku override annotations fixed"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavigationSwitcher-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
